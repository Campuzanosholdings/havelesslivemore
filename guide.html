  .lang-switch button{background:transparent;border:0;padding:6px 11px;cursor:pointer;}
  .lang-switch button.on{background:var(--navy);color:var(--paper);}

  .picker{max-width:760px;margin:0 auto;padding:0 20px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}

  .chip.on{background:var(--clay);border-color:var(--clay);color:var(--paper);}

  main{max-width:760px;margin:0 auto;padding:22px 20px 40px;}
  .hero{background:var(--navy);color:var(--sand);border-radius:16px;padding:24px 22px;margin-bottom:22px;position:relative;overflow:hidden;}
  .hero .where{font-family:'IBM Plex Mono',monospace;font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);}
  .hero h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1;margin:8px 0 6px;}

  .hero svg{position:absolute;right:-20px;bottom:-24px;width:160px;opacity:.14;}

  h2.sec{font-family:'Fraunces',serif;font-weight:500;font-size:1.35rem;margin:26px 0 12px;}
  h2.sec:first-child{margin-top:0;}
  .intro{font-size:.9rem;color:#4d5c57;margin:-4px 0 14px;}

  .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:480px){.facts{grid-template-columns:1fr;}}
  .fact{background:var(--sand);border-radius:12px;padding:14px 16px;}
  .fact .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--clay);margin-bottom:3px;}
  .fact .v{font-size:.92rem;}

  .card{background:#fff;border:1px solid var(--sand-deep);border-radius:14px;padding:16px 18px;margin-bottom:10px;display:block;}
  .card h3{font-family:'Fraunces',serif;font-weight:500;font-size:1.08rem;margin-bottom:3px;}
  .card p{font-size:.88rem;color:#4c5854;}
  .card .meta{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--seafoam);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .card.link{position:relative;padding-right:44px;}
  .card.link::after{content:"→";position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--clay);font-size:1.1rem;}
  .card.link:active{background:var(--sand);}
  ul.rules{list-style:none;}

  ul.rules li::before{content:"—";position:absolute;left:0;color:var(--seafoam);}
  .callout{background:#fff4ec;border:1px solid #e9c9b3;border-radius:12px;padding:14px 16px;font-size:.88rem;color:#6b3a24;margin:14px 0;}
  .callout.calm{background:#eef4f1;border-color:#c5dbd2;color:#2f4f45;}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:13px 14px;border-radius:12px;font-size:.88rem;font-weight:500;border:1px solid rgba(20,40,47,.2);background:#fff;}
  .btn.primary{background:var(--navy);color:var(--sand);border-color:var(--navy);}
  .btn.danger{background:var(--clay);color:#fff;border-color:var(--clay);}

  nav.tabs button.on{color:var(--clay);font-weight:600;}
  .foot{text-align:center;font-size:.78rem;color:#7c8a85;margin-top:34px;}
  .foot a{text-decoration:underline;}

function go(id, newTab, push){
  var p = P.filter(function(x){ return x.id === id; })[0]; if (p) cur = p;
  if (newTab) tab = newTab;
  if (push !== false) history.replaceState(null, '', '#' + cur.id + '/' + tab);
  try { localStorage.setItem('hllm-guide-home', cur.id); } catch (e) {}
  render(); window.scrollTo(0, 0);
  if (typeof gtag === 'function') gtag('event', 'guide_view', { property: cur.id, section: tab });
}

document.getElementById('picker').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if (b) go(b.dataset.id); });
document.getElementById('tabs').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) go(cur.id, b.dataset.tab); });
document.querySelectorAll('.lang-switch button').forEach(function(b){
  b.addEventListener('click', function(){
    L = LANGS.indexOf(b.dataset.lang); render();
    try { localStorage.setItem('hllm-lang', LANGS[L]); } catch (e) {}
  });
});

(function start(){
  var saved = null, home = null;
  try { saved = localStorage.getItem('hllm-lang'); home = localStorage.getItem('hllm-guide-home'); } catch (e) {}
  var nav = (navigator.language || '').toLowerCase().slice(0, 2);
  L = Math.max(0, LANGS.indexOf(saved || nav));
  var parts = location.hash.replace('#', '').split('/');
  go(parts[0] || home || 'sol', ['home','todo','eat','deliver','help'].indexOf(parts[1]) >= 0 ? parts[1] : 'home');
})();
