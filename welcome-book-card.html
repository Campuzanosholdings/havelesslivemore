    padding:28px;display:inline-block;margin-bottom:20px;
  }
  .qr-box img{width:220px;height:220px;display:block;}
  a.link{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:.85rem;
    color:var(--clay);word-break:break-all;margin-bottom:28px;text-decoration:none;
  }
  a.link:hover{text-decoration:underline;}
  a.download{
    display:inline-block;padding:12px 26px;border-radius:999px;
    background:var(--navy);color:var(--sand);text-decoration:none;
    font-size:.9rem;font-weight:500;
  }
  a.download:hover{background:var(--clay);}
  @media print{
    a.download{display:none;}
  }
